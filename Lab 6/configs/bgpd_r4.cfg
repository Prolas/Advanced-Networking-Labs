hostname r4
password bgpd
enable password bgpd

log file /home/advnet/Desktop/lab6/logs/bgpd_r4.log
debug bgp updates
!debug bgp keepalives
!debug bgp events

router bgp 65345
no bgp ebgp-requires-policy
redistribute connected

neighbor 192.34.34.3 remote-as 65345
!neighbor 192.34.34.3  distribute-list add-r5 out
neighbor 192.24.24.2 remote-as 65200
!neighbor 192.24.24.2  distribute-list add-r5 out

!access-list add-r5 permit 192.34.34.0/24
!access-list add-r5 permit 192.50.50.0/24

!neighbor 192.34.34.5 remote-as 65345

no bgp default ipv4-unicast
neighbor 2001:1:0:3434::3 remote-as 65345
no bgp default ipv4-unicast
neighbor 2001:1:0:2424::2 remote-as 65200
!no bgp default ipv4-unicast
!neighbor 2001:1:0:3434::5 remote-as 65345

address-family ipv4 unicast
  network 192.50.50.0/24
  neighbor 192.24.24.2 activate
  neighbor 192.34.34.4 activate
exit-address-family 

address-family ipv6
redistribute connected

neighbor 2001:1:0:3434::3 activate
neighbor 2001:1:0:2424::2 activate
!neighbor 2001:1:0:3434::5 activate

exit-address-family